name: Fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: command -v node; node --version; ls /opt/hostedtoolcache/node; command -v pnpm || true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: time pnpm install --frozen-lockfile --prefer-offline
      - run: time pnpm exec tsc --build
      - name: full suite json
        run: time pnpm exec vitest run --reporter=dot --reporter=json --outputFile=vitest.json
        continue-on-error: true
      - name: Per-test durations
        if: always()
        run: |
          jq -r '.testResults[] | (.name | sub(".*/packages/"; "")) as $f | .assertionResults[] | [(.duration // 0 | floor | tostring), .status, $f, ((.ancestorTitles | join(" > ")) + " > " + .title)] | @tsv' vitest.json | sort -rn | head -50
          echo '--- review.test.ts by describe'
          jq -r '.testResults[] | select(.name | endswith("review.test.ts")) | .assertionResults | group_by(.ancestorTitles[0]) | .[] | [((map(.duration // 0) | add) | floor | tostring), (.[0].ancestorTitles[0]), (length | tostring)] | @tsv' vitest.json | sort -rn
      - name: hermetic forks
        run: time pnpm exec vitest run --reporter=dot --exclude 'packages/capture/src/font-audit.test.ts' --exclude 'packages/capture/src/probe.test.ts' --exclude 'packages/drivers/src/dom.test.ts' --exclude 'packages/drivers/src/api.test.ts' --exclude 'packages/drivers/src/recording.test.ts' --exclude 'packages/agents/src/api-replay.test.ts' --exclude 'packages/agents/src/review.test.ts'
        continue-on-error: true
      - name: hermetic threads
        run: time pnpm exec vitest run --reporter=dot --pool=threads --exclude 'packages/capture/src/font-audit.test.ts' --exclude 'packages/capture/src/probe.test.ts' --exclude 'packages/drivers/src/dom.test.ts' --exclude 'packages/drivers/src/api.test.ts' --exclude 'packages/drivers/src/recording.test.ts' --exclude 'packages/agents/src/api-replay.test.ts' --exclude 'packages/agents/src/review.test.ts'
        continue-on-error: true
      - name: tsc warm noop
        run: time pnpm exec tsc --build

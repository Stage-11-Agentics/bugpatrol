# Fast: Stage 11's push and pull request tier for this fork.
#
# Speed is the point of this workflow. Each job holds a budget on its job
# clock (from the runner starting the job to its last step; queue time is not
# counted):
#
#   push to main    30 s
#   pull request    60 s
#
# Over budget is a defect, not a cost. Move the slowest test out
# (.github/fast/quarantine.txt), cut the step, or make it faster. Never raise
# a budget or a timeout to make a run fit. The last step of each job reports
# its clock and warns when it is over.
#
# It runs what a clean runner can run in seconds: Biome, knip, the TypeScript
# build, and the hermetic tests. Tests that need Playwright's Chromium or
# ffmpeg, slow ones and flaky ones are listed, with the reason, in
# .github/fast/quarantine.txt. The upstream workflows (ci.yml and the rest)
# are disabled on this fork with `gh workflow disable`; see CLAUDE.md.
name: Fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # the clock step reads the job's start time

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FAST_BUDGET: ${{ github.event_name == 'pull_request' && 60 || 30 }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 1 }}
    steps:
      - uses: actions/checkout@v4
      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      # No dependency cache: restoring the pnpm store (228 MB) takes longer
      # than installing from the registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # knip reads every workspace, the site too, so this job installs it all.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --error-on-warnings
      - run: pnpm knip
      - name: Job clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/fast/clock.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TypeScript's incremental build: dist and tsconfig.tsbuildinfo, which
      # record each file by a hash of its content, so a stale cache costs
      # time, never correctness.
      - id: tsc-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/*/dist
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-
      # The tests and the build need no site, so it is not installed.
      - run: pnpm install --frozen-lockfile --filter '!@bugpatrol/site'
      - id: build
        name: Typecheck and build
        run: pnpm exec tsc --build
      - name: Hermetic tests
        timeout-minutes: 1
        run: bash .github/fast/test.sh
      - if: always() && steps.build.outcome == 'success' && steps.tsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/*/dist
          key: tsc-${{ runner.os }}-${{ github.sha }}
      - name: Job clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/fast/clock.sh
